events {}

http {
  upstream web {
    server web:3000;
  }
  upstream api {
    server api:3001;
  }
  upstream media {
    server media:3002;
  }

  server {
    listen 80;
    server_name minhtravel.vn;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name media.minhtravel.vn;

    location /img/ {
      alias /data/variants/;
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri @media_service;
    }

    location @media_service {
      proxy_pass http://media;
      proxy_cache dynamic_resize;
      proxy_cache_valid 200 365d;
      proxy_cache_key "$uri";
    }

    location /upload {
      proxy_pass http://media;
      client_max_body_size 500M;
    }

    location /api/ {
      proxy_pass http://media;
    }
  }
}
